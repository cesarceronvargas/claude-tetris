<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <div class="theme-toggle">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" aria-label="Cambiar a modo claro" />
          <span class="slider"></span>
        </label>
        <span class="theme-icon" aria-hidden="true">☀️</span>
      </div>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
      <div id="start-screen" class="overlay start-screen">
        <div class="overlay-box">
          <p class="start-title">TETRIS</p>
          <span class="label">TOP 5</span>
          <div id="start-table" class="records-table-wrap"></div>
          <p id="start-stats" class="records-stats"></p>
          <button id="play-btn" class="btn-primary">Jugar</button>
          <button id="reset-records-btn" class="btn-link">Borrar records</button>
          <div id="reset-confirm" class="reset-confirm hidden">
            <span>¿Borrar todos los records?</span>
            <div class="reset-confirm-actions">
              <button id="reset-yes-btn" class="btn-small btn-danger">Sí, borrar</button>
              <button id="reset-no-btn" class="btn-small">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="records-section hidden">
          <p id="new-record-msg" class="new-record-msg hidden"></p>
          <form id="record-form" class="record-form hidden" autocomplete="off">
            <input type="text" id="record-name" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
            <button type="submit" id="save-record-btn" class="btn-small">Guardar</button>
          </form>
          <div id="gameover-table" class="records-table-wrap"></div>
          <p id="gameover-stats" class="records-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
