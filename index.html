<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <div class="theme-toggle">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" aria-label="Cambiar a modo claro" />
          <span class="slider"></span>
        </label>
        <span class="theme-icon" aria-hidden="true">☀️</span>
      </div>
      <div class="skin-picker">
        <label for="skin-select" class="label">ESTILO</label>
        <select id="skin-select" aria-label="Estilo de bloques">
          <option value="retro">Retro</option>
          <option value="neon">Neon</option>
          <option value="pastel">Pastel</option>
          <option value="pixel">Pixel art</option>
        </select>
      </div>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="pause-box">
        <p id="pause-title">PAUSA</p>
        <button type="button" class="pause-btn" id="pause-resume">Reanudar</button>
        <button type="button" class="pause-btn" id="pause-restart">Reiniciar</button>
        <button type="button" class="pause-btn" id="pause-controls-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> mover</li>
          <li><kbd>&uarr;</kbd><kbd>X</kbd> rotar</li>
          <li><kbd>&darr;</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="pause-level" for="start-level">
          Nivel inicial
          <select id="start-level"></select>
        </label>
        <p class="pause-hint">Se aplica al reiniciar</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
